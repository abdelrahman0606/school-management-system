version: 2
updates:
  # PHP dependencies (composer.json / composer.lock).
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      laravel:
        patterns:
          - "laravel/*"
      dev-dependencies:
        dependency-type: "development"

  # Frontend build tooling (package.json / package-lock.json — Vite, Tailwind).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # Base image in Dockerfile.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # Actions used by the CI workflows (tests.yml, pint.yml, phpstan.yml).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Self-hosted AI-detector microservice (services/ai-detector/requirements.txt).
  # transformers 4.47.1 -> 5.0.0 previously broke this on startup (a v5 API
  # change our custom PreTrainedModel subclass, DesklibAIDetectionModel in
  # main.py, didn't implement) -- now fixed and running on 5.14.1, verified
  # end to end (real weight loading + correct scoring on a smoke test, see
  # requirements.txt's comment) both right after the fix and again after a
  # further 5.5.0 -> 5.14.1 minor bump. Major-version bumps stay ignored here
  # going forward regardless: this dependency has already broken a custom
  # model class across one major version, so any future major bump (6.x,
  # etc.) needs the same manual build-and-smoke-test verification before
  # merging, not an auto-merge. Patch/minor bumps within 5.x are still
  # auto-proposed.
  - package-ecosystem: "pip"
    directory: "/services/ai-detector"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "transformers"
        update-types: ["version-update:semver-major"]
